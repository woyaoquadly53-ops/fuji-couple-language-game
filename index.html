<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>河口湖畔的四季牧场 · Nuestra Granja en el Monte Fuji</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Quicksand:wght@500;600;700&display=swap');

    :root {
      --paper-bg: rgba(252, 246, 232, 0.94);
      --paper-border: #c5a880;
      --ink-dark: #4a3728;
      --ink-soft: #7a604b;
      --ribbon-green: #7fa37c;
      --ribbon-pink: #d98a8c;
      --ribbon-gold: #e6b85c;
      --ribbon-blue: #7aa3b8;
      --shadow-soft: 0 8px 22px rgba(74, 55, 40, 0.18);
    }

    * {
      box-sizing: border-box;
      user-select: none;
    }

    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Quicksand', 'Noto Sans SC', sans-serif;
      color: var(--ink-dark);
      background: #cfe5ec;
    }

    /* 16:9 横版全屏舞台 */
    #game-stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: linear-gradient(180deg, #b6dcf0 0%, #e4f1e6 48%, #a6ca84 49%, #8cb56b 100%);
    }

    /* 实时水彩插画场景层 */
    #scene-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* 四角手账 HUD 悬浮层（中央70%+完全留白不遮挡画面） */
    .hud-layer {
      position: absolute;
      inset: 0;
      z-index: 10;
      pointer-events: none;
    }

    .hud-card {
      pointer-events: auto;
      background: var(--paper-bg);
      border: 2px solid var(--paper-border);
      border-radius: 16px;
      box-shadow: var(--shadow-soft);
      backdrop-filter: blur(4px);
    }

    /* 左上角：双人挂牌与语音问候 */
    .top-left-plaque {
      position: absolute;
      top: 16px;
      left: 18px;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-width: 265px;
    }

    .player-switcher {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .player-pill {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: 12px;
      border: 1.5px solid #d4bea0;
      background: #f7eedc;
      cursor: pointer;
      font-weight: 700;
      font-size: 13px;
      transition: all 0.2s;
    }

    .player-pill.active {
      background: #fff9eb;
      border-color: var(--ribbon-pink);
      box-shadow: 0 3px 10px rgba(217, 138, 140, 0.28);
      transform: translateY(-1px);
    }

    .greeting-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: #f5ead4;
      padding: 6px 10px;
      border-radius: 10px;
      border: 1px dashed #c8ad88;
      font-size: 12.5px;
    }

    .speak-btn {
      background: var(--ribbon-gold);
      color: #3d2b1d;
      border: none;
      border-radius: 8px;
      padding: 4px 8px;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap;
      transition: transform 0.15s;
    }

    .speak-btn:hover { transform: scale(1.06); }

    /* 右上角：金币、语言星星、饲料徽章 */
    .top-right-stats {
      position: absolute;
      top: 16px;
      right: 18px;
      display: flex;
      gap: 10px;
      pointer-events: auto;
    }

    .stat-badge {
      background: var(--paper-bg);
      border: 2px solid var(--paper-border);
      border-radius: 1
